<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="page_wrapper">
        <aside class="sidebar">
            <div class="sidebar_brand">
                <img src="" alt="">
                <span class="brand_name">Company Name</span>
            </div>
            <ul class="sidebar_menu">
                <li><a href="/views/dashboard/dashboard.html" class="active">Dashboard</a></li>
                    <li><a href="/views/group/table_group.html">Table Group</a></li>
                    <li><a href="/views/coa/table_Coa.html">Table COA</a></li>
                    <li><a href="/views/journal/table_Journal.html">Table Journal</a></li>
                    <li><a href="/views/buku_besar/buku_besar.html">Buku Besar</a></li>
            </ul>
                
            <div class="sidebar_footer">
                <a href="#"><i class="fa-solid fa-gear"></i>Settings</a>
                <a href="#"><i class="fa-solid fa-circle-question"></i>Help</a>
                <a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>Log Out</a>
            </div>
        </aside>

        <div class="main_content">
            <div class="show_filter">
                <p class="dashboard_title">Dashboard<a href="dashboard.html" class="fa-solid fa-arrows-rotate"></a></p>
                <div class="time_filter_content">
                    <div class="time">
                        <a class="custom" href=""><i class="fa-solid fa-calendar"></i>custom</a>
                        <a href="">24H</a>
                        <a href="">7D</a>
                        <a href="">1M</a>
                        <a href="">3M</a>
                    </div>
                    <div class="filter">
                        <a href=""><i class="fa-solid fa-filter"></i>Show Filters</a>
                        <a href="">Saved Filters</a>
                    </div>
                </div>    
            </div>
              

            <div class="main_dashboard">
                <div class="card">
                    <div class="content-area">
                        <div class="stat_container">
                            <div class="stat_card">
                                <p class="stat_title">Total Revenue</p>
                                <h2 id="total-revenue-value" class="stat_value"></h2>
                                <p class="stat_revenue"></p>
                            </div>
                            <div class="stat_card">
                                <p class="stat_title">Total Products</p>
                                <h2 id="total-quantity-value" class="stat_value"></h2>
                                <p class="stat_revenue"></p>
                            </div>
                            <div class="stat_card">
                                <p class="stat_title">Total Transaction</p>
                                <h2 id="total-count-transaction" class="stat_value"></h2>
                                <p class="stat_revenue"></p>
                            </div>
                            <div class="stat_card">
                                <p class="stat_title">Average Order Value</p>
                                <h2 id="total-average-order" class="stat_value"></h2>
                                <p class="stat_revenue"></p>
                            </div>
                        
                        </div>
                        <div class="charts">
                            <div class="line_chart">
                                <p class="line_title">Revenue Per Days</p>
                                <div class="line_chart_values">
                                    <canvas id="revenue-per-days"></canvas>
                                </div>
                            </div>

                        </div>

                        <div class="bottom_chart">
                            <div class="bottom_bar_chart">
                                <p class="bottom_bar_title"></p>
                            </div>
                            <div class="bottom_bar_chart">
                                <p class="bottom_bar_title"></p>
                            </div>
                            <div class="cluster_bar_chart">
                                <p class="cluster_bar_title"></p>
                            </div>
                        </div>
                                                   
                </div>


            </div>
            
        </div>

    

    </div>



    

            

        

    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="update.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
