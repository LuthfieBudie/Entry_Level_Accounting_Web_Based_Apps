<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="/views/auth/auth_guard.js"></script>
    <title>Edit Chart of Accounts</title>
</head>
<body>
    <div class="page_wrapper">
        <aside class="sidebar">
            <div class="sidebar_brand">
                <img src="" alt="">
                <span class="brand_name">Company</span>
            </div>
            <ul class="sidebar_menu">
                <li><a href="/views/dashboard/dashboard.html">Dashboard</a></li>
                <li><a href="/views/group/table_group.html">Table Group</a></li>
                <li><a href="/views/coa/table_Coa.html" class="active">Table COA</a></li>
                    <li><a href="/views/journal/table_Journal.html">Kas Masuk</a></li>
                    <li><a href="/views/journal/kas_keluar.html">Kas Keluar</a></li>
                <li><a href="/views/list journal/list_journal.html">List Journal</a></li>
                <li><a href="/views/buku_besar/buku_besar.html">Buku Besar</a></li>
            </ul>
                
            <div class="sidebar_footer">
                <a href="#"><i class="fa-solid fa-gear"></i>Settings</a>
                <a href="#"><i class="fa-solid fa-circle-question"></i>Help</a>
                <a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>Log Out</a>
            </div>
        </aside>

        <main class="main_content">
            <div class="show_filter">
                <p class="dashboard_title">Edit Chart Of Accounts <a href="edit_coa.html" class="fa-solid fa-arrows-rotate"></a></p>
            </div>
            
            <div class="form_container">
                <form id="editCoaForm">

                    <div class="form_group">
                        <label class="form_label" style="display: block;">Noper</label>
                        <input type="text" id="edit_noper" class="form_input" required placeholder="Contoh: Kas">
                    </div>

                    <div class="form_group">
                        <label class="form_label" style="display: block;">Naper</label>
                        <input type="text" id="edit_naper" class="form_input" required placeholder="Contoh: Kas">
                    </div>

                    <div class="form_group">
                        <label class="form_label" style="display: block;">Kelompok</label>
                        <input type="text" id="edit_klmpk" class="form_input" required placeholder="Contoh: 100">
                    </div>

                    <div class="form_group">
                        <label class="form_label" style="display: block;">Awal Debet</label>
                        <input type="number" id="edit_awald" class="form_input" required value="0">
                    </div>

                    <div class="form_group">
                        <label class="form_label" style="display: block;">Awal Kredit</label>
                        <input type="number" id="edit_awalk" class="form_input" required value="0">
                    </div>

                    <div class="form_group">
                        <label class="form_label" style="display: block;">Level</label>
                        <input type="number" id="edit_level" class="form_input" required placeholder="Contoh: 3">
                    </div>

                    <div class="form_group">
                        <label class="form_label" style="display: block;">Grup</label>
                        <input type="text" id="edit_grup" class="form_input" placeholder="Contoh: 10000C">
                    </div>

                    <button type="submit" class="submit_btn">
                        Simpan Perubahan
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="/views/coa/add_coa.js"></script>
</body>
</html>
