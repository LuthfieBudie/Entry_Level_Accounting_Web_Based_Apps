<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="page_wrapper">
        <aside class="sidebar">
            <div class="sidebar_brand">
                <img src="" alt="">
                <span class="brand_name">Company Name</span>
            </div>
            <ul class="sidebar_menu">
                <li><a href="/views/dashboard/dashboard.html" >Dashboard</a></li>
                    <li><a href="/views/group/table_group.html">Table Group</a></li>
                    <li><a href="/views/coa/table_Coa.html">Table COA</a></li>
                    <li><a href="/views/journal/table_Journal.html" class="active">Table Journal</a></li>
                    <li><a href="/views/buku_besar/buku_besar.html">Buku Besar</a></li>
            </ul>
                
            <div class="sidebar_footer">
                <a href="#"><i class="fa-solid fa-gear"></i>Settings</a>
                <a href="#"><i class="fa-solid fa-circle-question"></i>Help</a>
                <a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>Log Out</a>
            </div>
        </aside>

        <div class="main_content">
            <div class="show_filter">
                <p class="dashboard_title">Table Of Jurnal<a href="/views/journal/table_Journal.html" class="fa-solid fa-arrows-rotate"></a></p>
        </div>
        <div class="table_container">
            
                <div class="journal_add">
                    <form id="addProductForm">

                    <div class="form_group">
                        <label class="form_label" style="display: block;">Pilih Tanggal</label>
                        <input type="date" id="add_tanggal" class="form_input" required>
                    </div>

                    <div class="form_group">
                        <label class="form_label" style="display: block;">Tambah COA</label>
                        <select id="add_coa" class="form_input" required>
                            <option value="">Pilih Coa</option>
                        </select>
                    </div>

                    <div class="form_group">
                        <label class="form_label" style="display: block;">Tambah DK</label>
                        <select name="" id="add_dk" class="form_input" required>
                            <option value="">Pilih Debet / Kredit</option>
                            <option value="D">Debet</option>
                            <option value="K">Kredit</option>
                        </select>
                    </div>

                    <div class="form_group">
                        <label class="form_label" style="display: block;">Tambah Uraian</label>
                        <input type="text" id="add_uraian" class="form_input" required>
                    </div>

                    <div class="form_group">
                        <label class="form_label" style="display: block;">Tambah Nilai</label>
                        <input type="text" id="add_nilai" class="form_input" required>
                    </div>

                    <div class="form_group">
                        <label class="form_label" style="display: block;">User</label>
                        <input type="text" id="add_user" class="form_input" required>
                    </div>
                    <div class="buttonsave">
                        <button type="submit" class="submit_btn">
                        Simpan 
                    </button>
                    <button type="submit" class="posting_btn" onclick="printPDF()">
                        Posting
                    </button>
                    <button href="/views/buku_besar/buku_besar.html" type="submit" class="posting_btn">
                        Lihat Jurnal
                    </button>


                    </div>

                    
                </div>

                <div>
                    <table id="productTable">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Tanggal</th>
                                <th>COA</th>
                                <th>DK</th>
                                <th>Debet</th>
                                <th>Kredit</th>
                                <th>Keterangan</th>
                                <th>User</th>
                                <th>Logtime</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

    

    </div>



    

            

        

    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/views/journal/table_journal.js"></script>
</body>
</html>
